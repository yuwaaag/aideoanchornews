<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTN News Live Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; font-family: 'Noto Sans Devanagari', sans-serif; overflow: hidden; }
        
        /* News Header */
        .header { position: fixed; top: 0; width: 100%; height: 60px; background: linear-gradient(90deg, #900, #f00); display: flex; align-items: center; padding: 0 20px; color: white; font-size: 24px; font-weight: 900; border-bottom: 4px solid #ffcc00; z-index: 10; }

        /* Main Screen */
        #main-screen { position: fixed; top: 60px; left: 0; width: 100%; height: calc(100% - 180px); background: #111; display: flex; justify-content: center; align-items: center; }
        #news-video, #news-img { max-width: 100%; max-height: 100%; display: none; border: 2px solid #333; }

        /* Bottom Ticker/Headline */
        .ticker-box { position: fixed; bottom: 0; width: 100%; height: 120px; background: #ffee00; border-top: 5px solid #000; display: flex; align-items: center; padding: 0 20px; }
        #headline-text { font-size: 32px; color: #000; font-weight: 700; line-height: 1.2; }

        /* Start Button Overlay */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; color: white; }
        .start-btn { padding: 20px 50px; font-size: 28px; background: #f00; color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
    </style>
</head>
<body>

    <div id="overlay">
        <button class="start-btn" onclick="startStudio()">▶ START BROADCAST</button>
        <p style="margin-top: 20px;">News dikhane ke liye button dabayein</p>
    </div>

    <div class="header">PTN NEWS LIVE UPDATES</div>

    <div id="main-screen">
        <video id="news-video" autoplay muted></video>
        <img id="news-img" src="">
    </div>

    <div class="ticker-box">
        <div id="headline-text">Khabar load ho rahi hai...</div>
    </div>

    <script>
        // 1. Yahan apni Sheet ka CSV link paste karein
        const CSV_LINK = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp-jlH7474qQaJhBwVSKJCdKQOPlP_HYd5vcjdmg4mLChzCcf1icqe4xG6enPN0kEhCHjUXxW5r8xb/pub?gid=257041110&single=true&output=csv'; 

        let newsList = [];
        let index = 0;

        async function fetchData() {
            try {
                const res = await fetch(CSV_LINK + '&cache=' + Math.random());
                const text = await res.text();
                const rows = text.split('\n').slice(1); // Pehli row chhodi

                newsList = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        title: cols[1] ? cols[1].replace(/"/g, '') : "", // Column B
                        media: cols[3] ? cols[3].replace(/"/g, '').trim() : "" // Column D
                    };
                }).filter(n => n.title && n.media);
            } catch (err) {
                console.error("Error fetching data");
            }
        }

        function speak(txt) {
            return new Promise(resolve => {
                const utterance = new SpeechSynthesisUtterance(txt);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.9;
                utterance.onend = resolve;
                speechSynthesis.speak(utterance);
            });
        }

        async function playNews() {
            if (newsList.length === 0) return;
            if (index >= newsList.length) index = 0;

            const item = newsList[index];
            document.getElementById('headline-text').innerText = item.title;

            const video = document.getElementById('news-video');
            const img = document.getElementById('news-img');

            video.style.display = 'none';
            img.style.display = 'none';

            // Agar link mein 'id=' hai toh wo Google Drive video hai
            if (item.media.includes('id=')) {
                video.src = item.media;
                video.style.display = 'block';
                video.play();
            } else {
                img.src = item.media;
                img.style.display = 'block';
            }

            await speak(item.title);
            setTimeout(() => {
                index++;
                playNews();
            }, 3000); // 3 second ka gap
        }

        async function startStudio() {
            document.getElementById('overlay').style.display = 'none';
            await fetchData();
            playNews();
        }
    </script>
</body>
</html>
