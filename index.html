<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTN News Studio - Video Enabled</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Noto Sans Devanagari', sans-serif; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0000 0%, #000000 50%, #000a0a 100%); z-index: -1; }
        .header-bar { position: fixed; top: 0; width: 100%; height: 90px; background: linear-gradient(135deg, #cc0000 0%, #ff0000 50%, #cc0000 100%); border-bottom: 6px solid #ffcc00; display: flex; align-items: center; justify-content: space-between; padding: 0 50px; z-index: 50; }
        .channel-logo { font-size: 56px; font-weight: 900; color: white; font-family: 'Poppins', sans-serif; text-shadow: 4px 4px 8px #000; letter-spacing: 4px; }
        
        /* Media Container */
        #tv-screen { position: fixed; top: 90px; left: 0; width: 100vw; height: calc(82vh - 90px); background: #000; display: flex; justify-content: center; align-items: center; z-index: 1; }
        #news-img, #news-video { 
            display: none; /* Default hidden */
            max-width: 95%; max-height: 95%; 
            border: 6px solid #cc0000; 
            box-shadow: 0 0 60px rgba(255,0,0,0.6); 
            border-radius: 15px; 
        }

        .news-counter { position: fixed; top: 100px; left: 25px; background: rgba(0,0,0,0.9); padding: 20px 35px; border-radius: 20px; border: 4px solid #ff0000; z-index: 40; color: white; font-size: 22px; }
        .counter-number { color: #ffcc00; font-size: 38px; font-weight: 900; }
        
        .ticker-wrap { position: fixed; bottom: 0; width: 100%; height: 18vh; background: linear-gradient(135deg, #cc0000 0%, #990000 50%, #cc0000 100%); display: flex; flex-direction: column; justify-content: center; padding: 0 30px; color: white; border-top: 10px solid #ffcc00; z-index: 100; }
        #headline { font-size: 2.4vw; font-weight: 700; text-shadow: 4px 4px 8px #000; }
        
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; display: flex; justify-content: center; align-items: center; cursor: pointer; color: white; font-size: 40px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startChannel()">▶️ CLICK TO START PTN NEWS</div>

    <div class="header-bar"><div class="channel-logo">PTN NEWS</div></div>
    
    <div class="news-counter">खबर: <span class="counter-number" id="newsCounter">0/0</span></div>
    
    <div id="tv-screen">
        <img id="news-img" src="">
        <video id="news-video" autoplay muted playsinline></video>
    </div>
    
    <div class="ticker-wrap">
        <div id="headline">प्रसारण की प्रतीक्षा करें...</div>
    </div>

    <script>
        const CSV_LINK = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS5LBOefZdg-qJDLrY3I2RS2GDuiwkfTUDAPikuoXhabZomXt4JPMcQ7obkE663GHOoG2f-J0DJ8QKz/pub?gid=0&single=true&output=csv';

        let newsData = [];
        let index = 0;

        async function fetchNews() {
            try {
                const response = await fetch(CSV_LINK + '&t=' + Date.now());
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1);
                newsData = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        text: cols[0] ? cols[0].replace(/"/g, '').trim() : "",
                        media: cols[1] ? cols[1].replace(/"/g, '').trim() : ""
                    };
                }).filter(item => item.text.length > 2);
            } catch (e) { console.error("Fetch Error"); }
        }

        function speak(text) {
            return new Promise((resolve) => {
                window.speechSynthesis.cancel();
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = 'hi-IN';
                ut.rate = 0.85;
                ut.onend = resolve;
                window.speechSynthesis.speak(ut);
            });
        }

        async function playNews() {
            if (index >= newsData.length) index = 0;
            const item = newsData[index];

            document.getElementById('headline').innerText = item.text;
            document.getElementById('newsCounter').innerText = `${index + 1}/${newsData.length}`;

            const imgTag = document.getElementById('news-img');
            const videoTag = document.getElementById('news-video');

            // Check if media is video (mp4) or image
            if (item.media.toLowerCase().includes('.mp4') || item.media.toLowerCase().includes('video')) {
                imgTag.style.display = 'none';
                videoTag.style.display = 'block';
                videoTag.src = item.media;
                videoTag.play().catch(e => console.log("Autoplay blocked"));
            } else {
                videoTag.style.display = 'none';
                imgTag.style.display = 'block';
                imgTag.src = item.media || 'https://via.placeholder.com/800x450?text=PTN+NEWS';
            }

            await speak(item.text);
            await new Promise(r => setTimeout(r, 3000)); // Pause for 3 seconds

            index++;
            playNews();
        }

        async function startChannel() {
            document.getElementById('overlay').style.display = 'none';
            await fetchNews();
            if (newsData.length > 0) playNews();
            else alert("Sheet mein data nahi mila!");
        }
    </script>
</body>
</html>
