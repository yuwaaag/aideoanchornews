<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTN News Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;900&family=Bebas+Neue&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red:      #e8000d;
            --red-dark: #8a0008;
            --gold:     #f5c518;
            --white:    #ffffff;
            --bg:       #060000;
            --ticker-h: 100px;
            --header-h: 72px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            overflow: hidden;
            font-family: 'Noto Sans Devanagari', sans-serif;
            color: var(--white);
            height: 100vh; width: 100vw;
        }

        /* TV scanlines effect */
        body::after {
            content: '';
            position: fixed; inset: 0;
            background: repeating-linear-gradient(
                0deg, transparent, transparent 2px,
                rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
            );
            pointer-events: none; z-index: 9998;
        }

        /* ===== START OVERLAY ===== */
        #overlay {
            position: fixed; inset: 0;
            background: radial-gradient(ellipse at center, #1a0000 0%, #000 80%);
            z-index: 9000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        #overlay.hidden { opacity: 0; pointer-events: none; }

        .overlay-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(60px, 14vw, 140px);
            color: var(--red);
            letter-spacing: 10px;
            text-shadow: 0 0 60px rgba(232,0,13,0.9), 0 0 120px rgba(232,0,13,0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { text-shadow: 0 0 40px rgba(232,0,13,0.8); }
            50%      { text-shadow: 0 0 100px rgba(232,0,13,1), 0 0 160px rgba(255,60,60,0.5); }
        }

        .overlay-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(12px, 2vw, 18px);
            color: var(--gold);
            letter-spacing: 6px;
            margin: 10px 0 50px;
            text-transform: uppercase;
        }

        .start-btn {
            padding: 18px 55px;
            font-size: clamp(16px, 2.5vw, 24px);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            letter-spacing: 3px;
            color: white;
            background: linear-gradient(135deg, var(--red), var(--red-dark));
            border: 3px solid var(--gold);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 40px rgba(232,0,13,0.5);
        }
        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 80px rgba(232,0,13,0.9);
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed; top: 0; left: 0; right: 0;
            height: var(--header-h);
            background: linear-gradient(90deg, #5a0000 0%, var(--red) 25%, #ff2020 50%, var(--red) 75%, #5a0000 100%);
            border-bottom: 4px solid var(--gold);
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 500;
            box-shadow: 0 4px 30px rgba(0,0,0,0.9);
        }

        .header-left { display: flex; align-items: center; gap: 16px; }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(28px, 4.5vw, 48px);
            letter-spacing: 5px;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .live-pill {
            display: flex; align-items: center; gap: 7px;
            background: rgba(0,0,0,0.4);
            border: 1.5px solid rgba(255,255,255,0.3);
            padding: 4px 12px; border-radius: 5px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px; letter-spacing: 2px;
        }
        .live-dot {
            width: 9px; height: 9px;
            background: var(--gold); border-radius: 50%;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.2;} }

        .header-right { text-align: right; }
        #live-clock {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(16px, 2.2vw, 26px);
            font-weight: 700; color: var(--gold); letter-spacing: 2px;
            display: block;
        }
        #live-date {
            font-size: clamp(9px, 1.2vw, 12px);
            color: rgba(255,255,255,0.7); letter-spacing: 1px;
        }

        /* ===== MEDIA SCREEN ===== */
        #screen {
            position: fixed;
            top: var(--header-h); left: 0; right: 0;
            bottom: var(--ticker-h);
            background: #030000;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        /* Vignette */
        #screen::after {
            content: '';
            position: absolute; inset: 0;
            background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
            pointer-events: none; z-index: 2;
        }

        /* Loading spinner */
        #loading {
            display: flex; flex-direction: column;
            align-items: center; gap: 16px;
        }
        .spinner {
            width: 55px; height: 55px;
            border: 4px solid rgba(232,0,13,0.2);
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner-text {
            font-family: 'Rajdhani', sans-serif;
            color: rgba(255,255,255,0.3);
            font-size: 12px; letter-spacing: 3px;
        }

        #no-media {
            display: none; flex-direction: column;
            align-items: center; gap: 12px; opacity: 0.4;
            font-size: 14px;
        }
        #no-media span { font-size: 52px; }

        #media-err {
            display: none; flex-direction: column;
            align-items: center; gap: 10px;
            color: rgba(255,255,255,0.4); text-align: center;
        }
        #media-err span { font-size: 48px; }

        /* The actual media elements */
        #news-iframe {
            display: none;
            width: 94%; height: 92%;
            border: 2px solid rgba(245,197,24,0.3);
            border-radius: 6px;
            box-shadow: 0 0 50px rgba(232,0,13,0.2);
            background: #000;
            animation: fadeIn 0.5s ease;
        }

        #news-img {
            display: none;
            max-width: 94%; max-height: 92%;
            object-fit: contain;
            border: 2px solid rgba(245,197,24,0.3);
            border-radius: 6px;
            box-shadow: 0 0 50px rgba(232,0,13,0.2);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from{opacity:0;transform:scale(0.97);} to{opacity:1;transform:scale(1);} }

        /* ===== INFO BAR (top of screen) ===== */
        .info-bar {
            position: fixed;
            top: calc(var(--header-h) + 12px);
            left: 0; right: 0;
            display: flex; justify-content: space-between;
            padding: 0 16px; z-index: 50;
            pointer-events: none;
        }

        .info-pill-box {
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(245,197,24,0.3);
            border-radius: 7px;
            padding: 8px 14px;
            pointer-events: all;
        }

        .pill-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 10px; color: rgba(255,255,255,0.45);
            text-transform: uppercase; letter-spacing: 1.5px;
        }
        .pill-value {
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px; font-weight: 700;
            color: var(--gold); line-height: 1.1;
        }

        /* Video timer display */
        #video-timer-box { text-align: center; }
        #video-timer {
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px; color: var(--gold);
            letter-spacing: 1px;
        }
        #video-bar-wrap {
            width: 120px; height: 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px; margin-top: 4px; overflow: hidden;
        }
        #video-bar {
            height: 100%; width: 0%;
            background: var(--gold);
            border-radius: 2px;
            transition: width 1s linear;
        }

        /* ===== PROGRESS BAR ===== */
        #progress-bar {
            position: fixed;
            bottom: var(--ticker-h); left: 0;
            height: 3px; width: 0%;
            background: var(--gold);
            z-index: 501;
            box-shadow: 0 0 8px rgba(245,197,24,0.7);
        }

        /* ===== CONTROLS ===== */
        .controls {
            position: fixed;
            top: 50%; right: 14px;
            transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 10px;
            z-index: 100;
        }

        .ctrl {
            width: 42px; height: 42px;
            background: rgba(0,0,0,0.72);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 50%; color: white;
            font-size: 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .ctrl:hover { background: rgba(232,0,13,0.5); border-color: var(--gold); transform: scale(1.1); }
        .ctrl:active { transform: scale(0.93); }
        .ctrl.on { background: rgba(232,0,13,0.75); border-color: var(--gold); }

        /* ===== TICKER ===== */
        .ticker {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: var(--ticker-h);
            background: linear-gradient(90deg, #6a0000, var(--red) 15%, var(--red) 85%, #6a0000);
            border-top: 5px solid var(--gold);
            z-index: 500;
            display: flex; flex-direction: column;
            overflow: hidden;
            box-shadow: 0 -4px 25px rgba(0,0,0,0.9);
        }

        .ticker-top {
            display: flex; align-items: center; gap: 10px;
            padding: 4px 16px 2px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(245,197,24,0.25);
        }

        .breaking {
            background: var(--gold); color: #000;
            font-family: 'Rajdhani', sans-serif;
            font-size: 10px; font-weight: 900;
            padding: 2px 8px; border-radius: 3px;
            letter-spacing: 2px; white-space: nowrap;
            animation: flash 1.5s ease-in-out infinite;
        }
        @keyframes flash { 0%,100%{opacity:1;} 50%{opacity:0.5;} }

        #scroll-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: 11px; color: rgba(255,255,255,0.6);
            overflow: hidden; white-space: nowrap;
            text-overflow: ellipsis; flex: 1;
        }

        .headline-wrap {
            flex: 1;
            display: flex; align-items: center;
            padding: 0 20px; overflow: hidden;
        }

        #headline {
            font-size: clamp(16px, 3vw, 34px);
            font-weight: 700; color: white;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; width: 100%;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        #headline.out { opacity: 0; transform: translateY(8px); }

        /* ===== TOAST ===== */
        #toast {
            position: fixed;
            top: calc(var(--header-h) + 15px); left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(10,0,0,0.95);
            border: 2px solid var(--red);
            border-radius: 9px; padding: 12px 20px;
            color: white; font-size: 13px;
            z-index: 2000; opacity: 0;
            transition: all 0.35s ease;
            text-align: center; max-width: 86vw;
            pointer-events: none;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<!-- START OVERLAY -->
<div id="overlay">
    <div class="overlay-logo">PTN NEWS</div>
    <div class="overlay-sub">Sach Ki Awaaz - Voice of Truth</div>
    <button class="start-btn" onclick="startBroadcast()">LIVE BROADCAST SHURU KAREIN</button>
    <p style="margin-top:14px;color:rgba(255,255,255,0.25);font-size:11px;letter-spacing:3px;">CLICK TO BEGIN</p>
</div>

<!-- HEADER -->
<div class="header">
    <div class="header-left">
        <div class="logo">PTN NEWS</div>
        <div class="live-pill">
            <div class="live-dot"></div>
            <span>LIVE</span>
        </div>
    </div>
    <div class="header-right">
        <span id="live-clock">--:--:--</span>
        <span id="live-date"></span>
    </div>
</div>

<!-- INFO BAR -->
<div class="info-bar">
    <div class="info-pill-box">
        <div class="pill-label">Khabar</div>
        <div class="pill-value">
            <span id="cur">0</span> / <span id="total">0</span>
        </div>
    </div>

    <div class="info-pill-box" id="video-timer-box" style="display:none;">
        <div class="pill-label">Video Time</div>
        <div id="video-timer">0:00 / 0:00</div>
        <div id="video-bar-wrap"><div id="video-bar"></div></div>
    </div>

    <div class="info-pill-box" style="text-align:right;">
        <div class="pill-label" id="status-label">Status</div>
        <div class="pill-value" style="font-size:14px;" id="status-val">Starting...</div>
    </div>
</div>

<!-- TV SCREEN -->
<div id="screen">
    <div id="loading">
        <div class="spinner"></div>
        <div class="spinner-text">LOADING...</div>
    </div>
    <div id="no-media"><span>📰</span>Sirf Text Khabar</div>
    <div id="media-err"><span>⚠️</span><div>Media load nahi hui</div></div>

    <iframe id="news-iframe"
        src=""
        allow="autoplay; fullscreen"
        allowfullscreen
        frameborder="0">
    </iframe>

    <img id="news-img" src="" alt="News">
</div>

<!-- CONTROLS -->
<div class="controls">
    <button class="ctrl" id="btn-next"  onclick="userSkip(1)"   title="Next (Arrow Right)">&#9197;</button>
    <button class="ctrl" id="btn-pause" onclick="userPause()"   title="Pause (P)">&#9208;</button>
    <button class="ctrl" id="btn-prev"  onclick="userSkip(-1)"  title="Prev (Arrow Left)">&#9196;</button>
    <button class="ctrl" id="btn-mute"  onclick="userMute()"    title="Mute (M)">&#128266;</button>
    <button class="ctrl" id="btn-refresh" onclick="userRefresh()" title="Refresh (R)">&#128260;</button>
</div>

<!-- PROGRESS BAR -->
<div id="progress-bar"></div>

<!-- TICKER -->
<div class="ticker">
    <div class="ticker-top">
        <div class="breaking">LIVE</div>
        <div style="width:1px;height:12px;background:rgba(255,255,255,0.2);"></div>
        <div id="scroll-text">PTN News - Loading khabarein...</div>
    </div>
    <div class="headline-wrap">
        <div id="headline">Data load ho raha hai...</div>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>


<script>
// ============================================================
//  CONFIG - SIRF YAHAN BADLAV KARO
// ============================================================
const CFG = {
    CSV:          'https://docs.google.com/spreadsheets/d/e/2PACX-1vR_00lc89klk3FBoJCEOeet4uawIoHjQvDAu4z31hyIcgU0AspzizgsHsG7-icUqv7sLbhddlQSf9z7/pub?gid=1575189474&single=true&output=csv',  // Google Sheet publish CSV link
    COL_TEXT:     1,    // B = News Text (0-based)
    COL_LINK:     3,    // D = Direct Link
    COL_TYPE:     4,    // E = Media Type (VIDEO/IMAGE)
    COL_DURATION: 5,    // F = Video duration in seconds
    SPEECH_RATE:  0.88,
    SPEECH_LANG:  'hi-IN',
    AFTER_WAIT:   2500, // Next news se pehle kitna wait (ms)
    RETRY_MAX:    3,
    AUTO_REFRESH: 5     // Minutes (0 = off)
};

// ============================================================
//  STATE
// ============================================================
const ST = {
    news:      [],
    idx:       0,
    playing:   false,
    paused:    false,
    muted:     false,
    skip:      false,
    prev:      false,
    videoSec:  0,       // Current video total seconds
    elapsed:   0,       // Elapsed seconds for timer
    timerInt:  null,    // Video countdown interval
    refreshInt: null
};

// ============================================================
//  DOM
// ============================================================
const EL = {
    overlay:   document.getElementById('overlay'),
    headline:  document.getElementById('headline'),
    iframe:    document.getElementById('news-iframe'),
    img:       document.getElementById('news-img'),
    loading:   document.getElementById('loading'),
    noMedia:   document.getElementById('no-media'),
    mediaErr:  document.getElementById('media-err'),
    cur:       document.getElementById('cur'),
    total:     document.getElementById('total'),
    statusLbl: document.getElementById('status-label'),
    statusVal: document.getElementById('status-val'),
    progress:  document.getElementById('progress-bar'),
    clock:     document.getElementById('live-clock'),
    date:      document.getElementById('live-date'),
    toast:     document.getElementById('toast'),
    scrollTxt: document.getElementById('scroll-text'),
    timerBox:  document.getElementById('video-timer-box'),
    timerDisp: document.getElementById('video-timer'),
    timerBar:  document.getElementById('video-bar'),
    btnPause:  document.getElementById('btn-pause'),
    btnMute:   document.getElementById('btn-mute')
};

// ============================================================
//  CLOCK
// ============================================================
setInterval(() => {
    const n = new Date();
    EL.clock.innerText = n.toLocaleTimeString('hi-IN', {hour12: false});
    EL.date.innerText  = n.toLocaleDateString('hi-IN', {weekday:'short', day:'numeric', month:'short'});
}, 1000);

// ============================================================
//  HELPERS
// ============================================================
const wait = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, ms = 4000) {
    EL.toast.innerHTML = msg;
    EL.toast.classList.add('show');
    setTimeout(() => EL.toast.classList.remove('show'), ms);
}

function setStatus(label, val) {
    EL.statusLbl.innerText = label;
    EL.statusVal.innerText = val;
}

function secToTime(s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// ============================================================
//  CSV PARSER - Quotes ke andar commas handle karta hai
// ============================================================
function parseCSVLine(line) {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') {
            if (inQ && line[i+1] === '"') { cur += '"'; i++; }
            else inQ = !inQ;
        } else if (c === ',' && !inQ) {
            cols.push(cur.trim());
            cur = '';
        } else cur += c;
    }
    cols.push(cur.trim());
    return cols;
}

// ============================================================
//  DATA FETCH - Retry logic ke saath
// ============================================================
async function fetchData(attempt = 1) {
    if (!CFG.CSV || CFG.CSV.includes('YAHAN')) {
        toast('CSV link config mein set nahi hai!', 8000);
        setStatus('Error', 'CSV Missing');
        EL.loading.style.display = 'none';
        return false;
    }

    setStatus('Loading', 'Data aa raha hai...');

    try {
        const res = await fetch(CFG.CSV + '&t=' + Date.now());
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const text  = await res.text();
        const lines = text.split(/\r?\n/);

        if (lines.length < 2) throw new Error('Sheet khali hai');

        const parsed = lines.slice(1).map(line => {
            if (!line.trim()) return null;
            const c = parseCSVLine(line);

            const txt      = (c[CFG.COL_TEXT]     || '').replace(/^"|"$/g,'').trim();
            const link     = (c[CFG.COL_LINK]     || '').replace(/^"|"$/g,'').trim();
            const type     = (c[CFG.COL_TYPE]     || '').replace(/^"|"$/g,'').trim().toUpperCase();
            const durRaw   = (c[CFG.COL_DURATION] || '').replace(/^"|"$/g,'').trim();
            const dur      = parseFloat(durRaw) || 0;

            if (!txt || txt.length < 2) return null;

            return { text: txt, link: link, type: type, dur: dur };
        }).filter(Boolean);

        if (!parsed.length) throw new Error('Koi valid news nahi mili');

        ST.news = parsed;
        EL.total.innerText = parsed.length;
        EL.scrollTxt.innerText = parsed.map(n => n.text).join('   |   ');
        setStatus('Ready', parsed.length + ' khabarein');
        EL.loading.style.display = 'none';
        console.log('Loaded:', parsed.length, 'news items', parsed);
        return true;

    } catch (err) {
        console.error('Fetch error attempt ' + attempt + ':', err);
        if (attempt < CFG.RETRY_MAX) {
            setStatus('Retry', attempt + '/' + CFG.RETRY_MAX);
            await wait(2000);
            return fetchData(attempt + 1);
        }
        toast('Sheet se data nahi aaya: ' + err.message, 7000);
        setStatus('Error', 'Load failed');
        EL.headline.innerText = 'Google Sheet connect nahi hui - CSV link check karein';
        EL.loading.style.display = 'none';
        return false;
    }
}

// ============================================================
//  MEDIA RESET
// ============================================================
function resetMedia() {
    EL.iframe.style.display = 'none';
    EL.img.style.display    = 'none';
    EL.noMedia.style.display = 'none';
    EL.mediaErr.style.display = 'none';
    EL.loading.style.display  = 'none';
    EL.timerBox.style.display  = 'none';

    EL.iframe.src = '';
    EL.img.src    = '';

    stopVideoTimer();
}

// ============================================================
//  VIDEO COUNTDOWN TIMER
//  Column F se exact duration aata hai
//  Ye timer screen par dikhaata hai kitna baaki hai
// ============================================================
function startVideoTimer(totalSec) {
    stopVideoTimer();
    if (totalSec <= 0) return;

    ST.videoSec = totalSec;
    ST.elapsed  = 0;

    EL.timerBox.style.display = 'block';

    function tick() {
        if (ST.paused) return; // Paused ho toh count mat karo

        ST.elapsed++;
        const remaining = Math.max(0, ST.videoSec - ST.elapsed);
        const pct = Math.min(100, (ST.elapsed / ST.videoSec) * 100);

        EL.timerDisp.innerText = secToTime(ST.elapsed) + ' / ' + secToTime(ST.videoSec);
        EL.timerBar.style.width = pct + '%';
    }

    ST.timerInt = setInterval(tick, 1000);
}

function stopVideoTimer() {
    clearInterval(ST.timerInt);
    ST.timerInt = null;
    ST.videoSec = 0;
    ST.elapsed  = 0;
    EL.timerBar.style.width = '0%';
}

// ============================================================
//  PROGRESS BAR (bottom gold bar)
// ============================================================
function startProgress(totalMs) {
    EL.progress.style.transition = 'none';
    EL.progress.style.width = '0%';
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            EL.progress.style.transition = 'width ' + totalMs + 'ms linear';
            EL.progress.style.width = '100%';
        });
    });
}
function resetProgress() {
    EL.progress.style.transition = 'none';
    EL.progress.style.width = '0%';
}

// ============================================================
//  HEADLINE SWAP ANIMATION
// ============================================================
async function swapHeadline(text) {
    EL.headline.classList.add('out');
    await wait(320);
    EL.headline.innerText = text;
    EL.headline.classList.remove('out');
}

// ============================================================
//  SPEECH
// ============================================================
function speak(text) {
    return new Promise(resolve => {
        if (ST.muted) { resolve(); return; }

        window.speechSynthesis.cancel();
        const utt   = new SpeechSynthesisUtterance(text);
        utt.lang    = CFG.SPEECH_LANG;
        utt.rate    = CFG.SPEECH_RATE;
        utt.volume  = 1;

        // Hindi voice dhundho
        const voices = window.speechSynthesis.getVoices();
        const hindi  = voices.find(v =>
            v.lang === 'hi-IN' || v.lang === 'hi' ||
            v.name.toLowerCase().includes('hindi')
        );
        if (hindi) utt.voice = hindi;

        utt.onend   = resolve;
        utt.onerror = () => resolve();
        window.speechSynthesis.speak(utt);
    });
}

function stopSpeech() { window.speechSynthesis.cancel(); }

// ============================================================
//  LOAD MEDIA
// ============================================================
function loadIframe(url) {
    return new Promise(resolve => {
        EL.iframe.style.display = 'block';
        // autoplay=1 parameter add karo
        const src = url + (url.includes('?') ? '&autoplay=1' : '?autoplay=1');
        EL.iframe.onload = () => resolve();
        EL.iframe.src = src;
        setTimeout(resolve, 2500); // Fallback
    });
}

function loadImage(url) {
    return new Promise(resolve => {
        EL.img.style.display = 'block';
        EL.img.onload  = resolve;
        EL.img.onerror = () => {
            EL.img.style.display = 'none';
            EL.mediaErr.style.display = 'flex';
            resolve();
        };
        EL.img.src = url;
    });
}

// ============================================================
//  WAIT FUNCTION - Skip aane par bhi cancel ho sake
//  totalMs = kitna wait karna hai
//  Returns true agar skip/prev aaya
// ============================================================
function interruptibleWait(totalMs) {
    return new Promise(resolve => {
        const interval = 150; // Har 150ms check karo
        let elapsed = 0;
        const timer = setInterval(() => {
            if (!ST.playing || ST.skip || ST.prev) {
                clearInterval(timer);
                resolve(true); // Interrupted
                return;
            }
            // Paused ho toh elapsed mat badhao
            if (!ST.paused) elapsed += interval;
            if (elapsed >= totalMs) {
                clearInterval(timer);
                resolve(false); // Natural end
            }
        }, interval);
    });
}

// ============================================================
//  MAIN PLAY LOOP - Poora logic yahan hai
// ============================================================
async function playLoop() {
    if (!ST.playing) return;
    if (!ST.news.length) { setStatus('Empty', 'Koi news nahi'); return; }

    // Pause mein ruko
    while (ST.paused) {
        await wait(200);
        if (!ST.playing) return;
    }

    // Index wrap karo
    if (ST.idx >= ST.news.length) ST.idx = 0;
    if (ST.idx < 0) ST.idx = ST.news.length - 1;

    const item = ST.news[ST.idx];
    ST.skip = false;
    ST.prev = false;

    // UI update
    EL.cur.innerText = ST.idx + 1;
    setStatus('On Air', 'Khabar ' + (ST.idx + 1) + '/' + ST.news.length);
    swapHeadline(item.text);
    resetMedia();
    resetProgress();

    console.log('Playing [' + (ST.idx+1) + '] Type:' + item.type + ' Dur:' + item.dur + 's | ' + item.link);

    // =========================================================
    //  MEDIA LOAD
    // =========================================================
    if (!item.link) {
        EL.noMedia.style.display = 'flex'; // No media - sirf text

    } else if (item.type === 'VIDEO' || item.type === 'AUDIO') {
        await loadIframe(item.link);

        // =====================================================
        //  VIDEO TIMING LOGIC
        //  Column F (item.dur) se exact duration milti hai
        // =====================================================
        if (item.dur > 0) {
            // Exact duration hai - usi ke hisaab se wait karo
            startVideoTimer(item.dur);

            // Progress bar bhi video + speech dono ko cover kare
            const speechMs = Math.max(3000, (item.text.length / (2.8 * CFG.SPEECH_RATE)) * 1000);
            const totalMs  = Math.max(item.dur * 1000, speechMs) + CFG.AFTER_WAIT;
            startProgress(totalMs);

            // Speech aur video DONO parallel chalein
            const speechDone = speak(item.text);
            const videoDone  = interruptibleWait(item.dur * 1000);

            // Dono khatam ho tab tak ruko
            await Promise.all([speechDone, videoDone]);

        } else {
            // Duration nahi pata (Column F khali) - speech complete hone tak chalo
            // Minimum 30 second wait karo taaki video kuch toh chale
            const speechMs  = Math.max(3000, (item.text.length / (2.8 * CFG.SPEECH_RATE)) * 1000);
            const minWaitMs = Math.max(speechMs, 30000); // Minimum 30 second
            startProgress(minWaitMs + CFG.AFTER_WAIT);

            setStatus('Playing', 'Video (duration unknown)');
            const speechDone = speak(item.text);
            const waitDone   = interruptibleWait(minWaitMs);
            await Promise.all([speechDone, waitDone]);
        }

    } else if (item.type === 'IMAGE') {
        await loadImage(item.link);

        // Image ke liye sirf speech ka wait karo
        const speechMs = Math.max(3000, (item.text.length / (2.8 * CFG.SPEECH_RATE)) * 1000);
        startProgress(speechMs + CFG.AFTER_WAIT);
        await speak(item.text);

    } else {
        // Type pata nahi - link se guess karo
        const lc = (item.link || '').toLowerCase();
        if (lc.includes('/preview')) {
            await loadIframe(item.link);
            const ms = Math.max(30000, (item.text.length / (2.8 * CFG.SPEECH_RATE)) * 1000);
            startProgress(ms + CFG.AFTER_WAIT);
            await Promise.all([speak(item.text), interruptibleWait(ms)]);
        } else {
            await loadImage(item.link);
            const ms = Math.max(3000, (item.text.length / (2.8 * CFG.SPEECH_RATE)) * 1000);
            startProgress(ms + CFG.AFTER_WAIT);
            await speak(item.text);
        }
    }

    // =========================================================
    //  SKIP / PREV CHECK
    // =========================================================
    if (!ST.playing) return;

    if (ST.skip || ST.prev) {
        stopVideoTimer();
        ST.idx += ST.prev ? -1 : 1;
        playLoop();
        return;
    }

    // =========================================================
    //  AFTER WAIT (transition gap)
    // =========================================================
    stopVideoTimer();
    await interruptibleWait(CFG.AFTER_WAIT);

    if (!ST.playing) return;
    if (ST.skip || ST.prev) {
        ST.idx += ST.prev ? -1 : 1;
        playLoop();
        return;
    }

    ST.idx++;
    playLoop();
}

// ============================================================
//  CONTROLS
// ============================================================
function userSkip(dir) {
    if (dir === 1)  { ST.skip = true; stopSpeech(); stopVideoTimer(); ST.idx++; }
    if (dir === -1) { ST.prev = true; stopSpeech(); stopVideoTimer(); ST.idx = Math.max(0, ST.idx - 1); }
}

function userPause() {
    ST.paused = !ST.paused;
    EL.btnPause.innerHTML = ST.paused ? '&#9654;' : '&#9208;';
    EL.btnPause.classList.toggle('on', ST.paused);
    if (ST.paused) { stopSpeech(); setStatus('Paused', 'Ruka hua'); }
    else setStatus('On Air', 'Resume...');
}

function userMute() {
    ST.muted = !ST.muted;
    EL.btnMute.innerHTML = ST.muted ? '&#128263;' : '&#128266;';
    EL.btnMute.classList.toggle('on', ST.muted);
    if (ST.muted) stopSpeech();
}

async function userRefresh() {
    stopSpeech(); stopVideoTimer(); resetMedia();
    EL.loading.style.display = 'flex';
    const ok = await fetchData();
    if (ok && ST.playing) { ST.idx = 0; playLoop(); }
}

// ============================================================
//  AUTO REFRESH
// ============================================================
function setupAutoRefresh() {
    if (!CFG.AUTO_REFRESH) return;
    clearInterval(ST.refreshInt);
    ST.refreshInt = setInterval(async () => {
        console.log('Auto-refresh...');
        await fetchData();
    }, CFG.AUTO_REFRESH * 60000);
}

// ============================================================
//  START
// ============================================================
async function startBroadcast() {
    EL.overlay.classList.add('hidden');
    setTimeout(() => EL.overlay.style.display = 'none', 800);

    EL.loading.style.display = 'flex';
    setStatus('Starting', 'Please wait...');

    // Voice warm-up (mobile ke liye zaroori)
    window.speechSynthesis.cancel();
    const warm = new SpeechSynthesisUtterance(' ');
    warm.volume = 0;
    window.speechSynthesis.speak(warm);

    // Voices preload
    if (!window.speechSynthesis.getVoices().length) {
        await new Promise(r => {
            window.speechSynthesis.onvoiceschanged = r;
            setTimeout(r, 2000);
        });
    }

    const ok = await fetchData();

    if (ok) {
        ST.playing = true;
        setupAutoRefresh();
        playLoop();
    } else {
        EL.headline.innerText = 'Sheet se data nahi aaya - CSV link config mein check karein';
    }
}

// ============================================================
//  KEYBOARD
// ============================================================
document.addEventListener('keydown', e => {
    switch(e.code) {
        case 'ArrowRight':
        case 'Space':      e.preventDefault(); userSkip(1);  break;
        case 'ArrowLeft':  e.preventDefault(); userSkip(-1); break;
        case 'KeyP':       userPause();   break;
        case 'KeyM':       userMute();    break;
        case 'KeyR':       userRefresh(); break;
    }
});

// Preload voices
window.speechSynthesis.getVoices();
</script>
