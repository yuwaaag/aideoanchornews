<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTN News Studio - Automated</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Noto Sans Devanagari', sans-serif; }
        
        /* Studio Background */
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a0000 0%, #000 100%); z-index: -1; }
        
        /* Header */
        .header-bar { position: fixed; top: 0; width: 100%; height: 80px; background: linear-gradient(90deg, #cc0000, #ff0000, #cc0000); border-bottom: 5px solid #ffcc00; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; z-index: 100; box-shadow: 0 5px 20px rgba(0,0,0,0.8); }
        .channel-logo { font-size: 45px; font-weight: 900; color: white; font-family: 'Poppins', sans-serif; text-shadow: 3px 3px 5px #000; }
        
        /* Media Screen */
        #tv-screen { position: fixed; top: 80px; left: 0; width: 100vw; height: calc(80vh - 80px); background: #000; display: flex; justify-content: center; align-items: center; z-index: 1; }
        #news-img, #news-video { 
            display: none; 
            max-width: 90%; max-height: 90%; 
            border: 5px solid #fff; 
            box-shadow: 0 0 50px rgba(255,0,0,0.5);
            border-radius: 10px;
        }

        /* News Counter & Ticker */
        .news-counter { position: fixed; top: 100px; left: 20px; background: rgba(0,0,0,0.8); padding: 15px 25px; border-radius: 10px; border-left: 5px solid #ffcc00; color: white; z-index: 50; }
        .ticker-wrap { position: fixed; bottom: 0; width: 100%; height: 20vh; background: #cc0000; border-top: 8px solid #ffcc00; display: flex; align-items: center; padding: 0 30px; z-index: 100; }
        #headline { color: white; font-size: 2.5vw; font-weight: 800; text-shadow: 2px 2px 4px #000; width: 100%; }

        /* Start Overlay */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; color: white; }
        .start-btn { padding: 30px 60px; font-size: 35px; background: #ff0000; border: 4px solid #ffcc00; border-radius: 50px; font-weight: bold; transition: 0.3s; }
        .start-btn:hover { transform: scale(1.1); background: #cc0000; }
    </style>
</head>
<body>

    <div id="overlay" onclick="startChannel()">
        <div class="start-btn">▶️ START PTN BROADCAST</div>
        <p style="margin-top: 20px;">प्रसारण शुरू करने के लिए क्लिक करें</p>
    </div>

    <div class="header-bar">
        <div class="channel-logo">PTN NEWS</div>
        <div id="live-clock" style="color: white; font-weight: bold; font-size: 20px;"></div>
    </div>

    <div class="news-counter">Live Khabar: <span id="counter" style="color:#ffcc00; font-weight: 900;">0/0</span></div>

    <div id="tv-screen">
        <img id="news-img" src="">
        <video id="news-video" autoplay playsinline></video>
    </div>

    <div class="ticker-wrap">
        <div id="headline">Data loading... Please wait.</div>
    </div>

    <script>
        // 1. Apni CSV Link yahan daalein
        const CSV_LINK = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS5LBOefZdg-qJDLrY3I2RS2GDuiwkfTUDAPikuoXhabZomXt4JPMcQ7obkE663GHOoG2f-J0DJ8QKz/pub?gid=0&single=true&output=csv'; 

        let newsData = [];
        let index = 0;

        // Clock Function
        setInterval(() => {
            document.getElementById('live-clock').innerText = new Date().toLocaleTimeString('hi-IN');
        }, 1000);

        async function fetchNews() {
            try {
                const response = await fetch(CSV_LINK + '&t=' + Date.now());
                const csvData = await response.text();
                const rows = csvData.split(/\r?\n/).slice(1);
                
                newsData = rows.map(row => {
                    // Complex split to handle commas inside quotes
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        text: cols[1] ? cols[1].replace(/"/g, '').trim() : "No Title", // Column B
                        media: cols[3] ? cols[3].replace(/"/g, '').trim() : ""        // Column D (Direct Link)
                    };
                }).filter(item => item.text !== "No Title" && item.media !== "");
                
                console.log("News Loaded Successfully:", newsData);
            } catch (error) {
                console.error("Data Fetch Error:", error);
                document.getElementById('headline').innerText = "Error: Google Sheet connect nahi ho rahi!";
            }
        }

        function speak(text) {
            return new Promise((resolve) => {
                window.speechSynthesis.cancel();
                const ut = new SpeechSynthesisUtterance(text);
                ut.lang = 'hi-IN';
                ut.rate = 0.9;
                ut.onend = resolve;
                window.speechSynthesis.speak(ut);
            });
        }

        async function playNews() {
            if (newsData.length === 0) return;
            if (index >= newsData.length) index = 0;

            const item = newsData[index];
            const headlineEl = document.getElementById('headline');
            const imgEl = document.getElementById('news-img');
            const videoEl = document.getElementById('news-video');
            const counterEl = document.getElementById('counter');

            headlineEl.innerText = item.text;
            counterEl.innerText = `${index + 1}/${newsData.length}`;

            // Reset media
            imgEl.style.display = 'none';
            videoEl.style.display = 'none';
            videoEl.pause();

            // Check if Video or Image
            if (item.media.includes('id=') || item.media.includes('.mp4')) {
                videoEl.style.display = 'block';
                videoEl.src = item.media;
                videoEl.muted = true; // For autoplay
                videoEl.play().catch(e => console.log("Video Play Error:", e));
            } else {
                imgEl.style.display = 'block';
                imgEl.src = item.media;
            }

            // Speak and loop
            await speak(item.text);
            await new Promise(r => setTimeout(r, 2000)); // 2 sec stay

            index++;
            playNews();
        }

        async function startChannel() {
            document.getElementById('overlay').style.display = 'none';
            await fetchNews();
            if (newsData.length > 0) {
                playNews();
            } else {
                alert("Sheet khali hai ya link sahi nahi hai!");
            }
        }

        // Initialize Voices
        window.speechSynthesis.getVoices();
    </script>
</body>
</html>
