<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTN News Studio - Fixed</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        /* CSS Same rakha hai taaki design na badle */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Noto Sans Devanagari', sans-serif; }
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0000 0%, #000000 50%, #000a0a 100%); z-index: -1; }
        .header-bar { position: fixed; top: 0; width: 100%; height: 90px; background: linear-gradient(135deg, #cc0000 0%, #ff0000 50%, #cc0000 100%); border-bottom: 6px solid #ffcc00; display: flex; align-items: center; justify-content: space-between; padding: 0 50px; z-index: 50; box-shadow: 0 8px 30px rgba(0,0,0,0.9); }
        .channel-logo { font-size: 56px; font-weight: 900; color: white; font-family: 'Poppins', sans-serif; text-shadow: 4px 4px 8px #000, 0 0 30px #ffcc00; letter-spacing: 4px; }
        .live-badge { display: flex; align-items: center; background: white; padding: 12px 30px; border-radius: 35px; }
        .live-dot { width: 18px; height: 18px; background: #ff0000; border-radius: 50%; margin-right: 12px; animation: blink 1.2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .live-text { color: #ff0000; font-weight: 900; font-size: 28px; font-family: 'Poppins', sans-serif; }
        .time-widget { position: fixed; top: 100px; right: 25px; background: rgba(0,0,0,0.9); padding: 20px 35px; border-radius: 20px; border: 4px solid #ffcc00; z-index: 40; }
        .time-display { font-size: 42px; color: #ffcc00; font-weight: 900; text-align: center; font-family: 'Poppins', sans-serif; }
        .date-display { font-size: 20px; color: #fff; text-align: center; margin-top: 8px; }
        #tv-screen { position: fixed; top: 90px; left: 0; width: 100vw; height: calc(82vh - 90px); background: #000; display: flex; justify-content: center; align-items: center; z-index: 1; }
        #news-img { max-width: 92%; max-height: 92%; border: 6px solid #cc0000; box-shadow: 0 0 60px rgba(255,0,0,0.6); border-radius: 15px; object-fit: contain; }
        .news-counter { position: fixed; top: 100px; left: 25px; background: rgba(0,0,0,0.9); padding: 20px 35px; border-radius: 20px; border: 4px solid #ff0000; z-index: 40; color: white; font-size: 22px; font-weight: 700; }
        .counter-number { color: #ffcc00; font-size: 38px; font-weight: 900; font-family: 'Poppins', sans-serif; }
        .ticker-wrap { position: fixed; bottom: 0; width: 100%; height: 18vh; background: linear-gradient(135deg, #cc0000 0%, #990000 50%, #cc0000 100%); display: flex; flex-direction: column; justify-content: center; padding: 0 30px; color: white; border-top: 10px solid #ffcc00; box-shadow: 0 -15px 40px rgba(0,0,0,0.9); z-index: 100; }
        .ticker-header { display: flex; align-items: center; margin-bottom: 12px; }
        .label { background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); color: #000; padding: 15px 40px; font-size: 2.2vw; font-weight: 900; border-radius: 12px; margin-right: 30px; border: 4px solid #ff0000; font-family: 'Poppins', sans-serif; }
        #headline { font-size: 2.4vw; font-weight: 700; text-shadow: 4px 4px 8px #000; line-height: 1.6; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .start-button { background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%); color: white; border: 6px solid #ffcc00; padding: 50px 120px; font-size: 54px; font-weight: 900; border-radius: 30px; cursor: pointer; font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div id="overlay" onclick="startChannel()">
        <div class="start-button">▶️ START BROADCAST</div>
    </div>
    <div class="header-bar"><div class="channel-logo">PTN NEWS</div><div class="live-badge"><div class="live-dot"></div><div class="live-text">LIVE</div></div></div>
    <div class="time-widget"><div class="time-display" id="timeDisplay">00:00:00</div><div class="date-display" id="dateDisplay">Loading...</div></div>
    <div class="news-counter">खबर: <span class="counter-number" id="newsCounter">0/0</span></div>
    <div id="tv-screen"><img id="news-img" src="" alt="PTN News"></div>
    <div class="ticker-wrap"><div class="ticker-header"><div class="label">⚡ BREAKING NEWS</div></div><div id="headline">लोड हो रहा है...</div></div>

    <script>
        // 1. LINK CHECK: Ensure this is the "Published CSV" link
        const CSV_LINK = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS5LBOefZdg-qJDLrY3I2RS2GDuiwkfTUDAPikuoXhabZomXt4JPMcQ7obkE663GHOoG2f-J0DJ8QKz/pub?gid=0&single=true&output=csv';

        let newsData = [];
        let index = 0;
        let isRunning = false;

        // Time Update
        setInterval(() => {
            const now = new Date();
            document.getElementById('timeDisplay').innerText = now.toLocaleTimeString('hi-IN', { hour12: false });
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('hi-IN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }, 1000);

        // Robust CSV Parser
        async function fetchNews() {
            try {
                const response = await fetch(CSV_LINK + '&cachebuster=' + Date.now());
                const data = await response.text();
                
                // Rows split logic
                const rows = data.split(/\r?\n/).slice(1); 
                newsData = rows.map(row => {
                    // Simple comma split (Handles basic CSV)
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        text: columns[0] ? columns[0].replace(/"/g, '').trim() : "",
                        image: columns[1] ? columns[1].replace(/"/g, '').trim() : ""
                    };
                }).filter(item => item.text.length > 2);

                console.log("Data Loaded:", newsData);
            } catch (error) {
                console.error("CSV Fetch Error:", error);
                alert("Google Sheet load nahi ho payi. Link check karein.");
            }
        }

        // Voice Engine
        function speak(text) {
            return new Promise((resolve) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.9;
                
                // Voice selection
                const voices = window.speechSynthesis.getVoices();
                const hindiVoice = voices.find(v => v.lang.includes('hi')) || voices[0];
                utterance.voice = hindiVoice;

                utterance.onend = resolve;
                utterance.onerror = resolve; // Continue even if voice fails
                window.speechSynthesis.speak(utterance);
            });
        }

        async function playNews() {
            if (!isRunning || newsData.length === 0) return;

            if (index >= newsData.length) index = 0;
            const currentItem = newsData[index];

            // Update UI
            document.getElementById('headline').innerText = currentItem.text;
            document.getElementById('newsCounter').innerText = `${index + 1}/${newsData.length}`;
            
            if (currentItem.image) {
                document.getElementById('news-img').src = currentItem.image;
            }

            // Speak and Wait
            await speak(currentItem.text);
            await new Promise(r => setTimeout(r, 2000)); // 2 sec gap

            index++;
            playNews();
        }

        async function startChannel() {
            document.getElementById('overlay').style.display = 'none';
            isRunning = true;
            await fetchNews();
            if (newsData.length > 0) {
                playNews();
            } else {
                alert("Sheet khali hai ya data format galat hai!");
            }
        }

        // Fix for Chrome Speech
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    </script>
</body>
</html>
