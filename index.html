<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTN News Studio - Live Broadcast</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Noto Sans Devanagari', sans-serif; }
        
        .bg-animation { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0a0000 0%, #000000 50%, #000a0a 100%); z-index: -1; }
        .bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 0; }
        .particle { position: absolute; background: radial-gradient(circle, rgba(255,0,0,0.3) 0%, transparent 70%); border-radius: 50%; animation: float 20s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0) translateX(0); opacity: 0; } 50% { opacity: 0.7; } }
        
        .header-bar { position: fixed; top: 0; width: 100%; height: 90px; background: linear-gradient(135deg, #cc0000 0%, #ff0000 50%, #cc0000 100%); border-bottom: 6px solid #ffcc00; display: flex; align-items: center; justify-content: space-between; padding: 0 50px; z-index: 50; box-shadow: 0 8px 30px rgba(0,0,0,0.9); animation: slideDown 1.2s ease-out; }
        @keyframes slideDown { from { transform: translateY(-120%); } to { transform: translateY(0); } }
        .channel-logo { font-size: 56px; font-weight: 900; color: white; font-family: 'Poppins', sans-serif; text-shadow: 4px 4px 8px #000, 0 0 30px #ffcc00; letter-spacing: 4px; animation: logoGlow 2.5s infinite alternate; }
        @keyframes logoGlow { from { text-shadow: 4px 4px 8px #000, 0 0 30px #ffcc00; } to { text-shadow: 4px 4px 8px #000, 0 0 60px #ffcc00, 0 0 90px #ff0000; } }
        .live-badge { display: flex; align-items: center; background: white; padding: 12px 30px; border-radius: 35px; animation: pulse 1.8s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .live-dot { width: 18px; height: 18px; background: #ff0000; border-radius: 50%; margin-right: 12px; animation: blink 1.2s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .live-text { color: #ff0000; font-weight: 900; font-size: 28px; font-family: 'Poppins', sans-serif; }
        
        .time-widget { position: fixed; top: 100px; right: 25px; background: linear-gradient(135deg, rgba(0,0,0,0.95) 0%, rgba(20,0,0,0.95) 100%); padding: 20px 35px; border-radius: 20px; border: 4px solid #ffcc00; z-index: 40; box-shadow: 0 8px 30px rgba(255,204,0,0.6); }
        .time-display { font-size: 42px; color: #ffcc00; font-weight: 900; text-align: center; text-shadow: 3px 3px 6px #000; font-family: 'Poppins', sans-serif; }
        .date-display { font-size: 20px; color: #fff; text-align: center; margin-top: 8px; }
        
        #tv-screen { position: fixed; top: 90px; left: 0; width: 100vw; height: calc(82vh - 90px); background: #000; display: flex; justify-content: center; align-items: center; z-index: 1; }
        .broadcast-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #news-video, #news-img { max-width: 92%; max-height: 92%; border: 6px solid #cc0000; box-shadow: 0 0 60px rgba(255,0,0,0.6); border-radius: 15px; animation: mediaAppear 1.2s ease-out; }
        #news-video { display: none; }
        @keyframes mediaAppear { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .anchor-overlay { position: absolute; bottom: 18%; left: 3%; width: 280px; height: 350px; background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(20,0,0,0.85) 100%); border: 5px solid #ffcc00; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 40px rgba(0,0,0,0.9); animation: anchorSlideIn 1.5s ease-out; }
        @keyframes anchorSlideIn { from { opacity: 0; transform: translateX(-300px); } to { opacity: 1; transform: translateX(0); } }
        .anchor-avatar { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%); border: 5px solid #ffcc00; display: flex; align-items: center; justify-content: center; font-size: 60px; margin-bottom: 15px; animation: avatarPulse 2s infinite; }
        @keyframes avatarPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .anchor-name { color: #ffcc00; font-size: 24px; font-weight: 900; margin-bottom: 8px; font-family: 'Poppins', sans-serif; }
        .anchor-title { color: #fff; font-size: 16px; font-weight: 700; }
        .speaking-indicator { margin-top: 15px; display: flex; gap: 6px; }
        .speak-bar { width: 6px; background: #ffcc00; border-radius: 3px; animation: speakWave 0.6s ease-in-out infinite; }
        .speak-bar:nth-child(1) { height: 15px; animation-delay: 0s; }
        .speak-bar:nth-child(2) { height: 25px; animation-delay: 0.1s; }
        .speak-bar:nth-child(3) { height: 35px; animation-delay: 0.2s; }
        .speak-bar:nth-child(4) { height: 25px; animation-delay: 0.3s; }
        .speak-bar:nth-child(5) { height: 15px; animation-delay: 0.4s; }
        @keyframes speakWave { 0%, 100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.2); } }
        
        .corner-decoration { position: absolute; width: 70px; height: 70px; border: 6px solid #ffcc00; z-index: 10; }
        .corner-tl { top: 2%; left: 2%; border-right: none; border-bottom: none; }
        .corner-tr { top: 2%; right: 2%; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 20%; left: 2%; border-right: none; border-top: none; }
        .corner-br { bottom: 20%; right: 2%; border-left: none; border-top: none; }
        
        .ticker-wrap { position: fixed; bottom: 0; width: 100%; height: 18vh; background: linear-gradient(135deg, #cc0000 0%, #990000 50%, #cc0000 100%); display: flex; flex-direction: column; justify-content: center; padding: 0 30px; color: white; border-top: 10px solid #ffcc00; box-shadow: 0 -15px 40px rgba(0,0,0,0.9); z-index: 100; animation: tickerSlideUp 1s ease-out; }
        @keyframes tickerSlideUp { from { transform: translateY(120%); } to { transform: translateY(0); } }
        .ticker-header { display: flex; align-items: center; margin-bottom: 12px; }
        .label { background: linear-gradient(135deg, #ffcc00 0%, #ff9900 100%); color: #000; padding: 15px 40px; font-size: 2.2vw; font-weight: 900; border-radius: 12px; margin-right: 30px; animation: labelPulse 1.8s infinite; border: 4px solid #ff0000; font-family: 'Poppins', sans-serif; }
        @keyframes labelPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        #headline { font-size: 2.4vw; font-weight: 700; text-shadow: 4px 4px 8px #000; line-height: 1.6; animation: textSlideIn 1s ease-out; }
        @keyframes textSlideIn { from { opacity: 0; transform: translateX(-80px); } to { opacity: 1; transform: translateX(0); } }
        
        .news-counter { position: fixed; top: 100px; left: 25px; background: linear-gradient(135deg, rgba(0,0,0,0.95) 0%, rgba(20,0,0,0.95) 100%); padding: 20px 35px; border-radius: 20px; border: 4px solid #ff0000; z-index: 40; color: white; font-size: 22px; font-weight: 700; }
        .counter-number { color: #ffcc00; font-size: 38px; font-weight: 900; font-family: 'Poppins', sans-serif; }
        
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(0,0,0,0.98) 0%, rgba(20,0,0,0.98) 100%); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; }
        .start-button { background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%); color: white; border: 6px solid #ffcc00; padding: 50px 120px; font-size: 54px; font-weight: 900; border-radius: 30px; cursor: pointer; animation: startPulse 2s infinite; transition: all 0.4s; font-family: 'Poppins', sans-serif; }
        .start-button:hover { transform: scale(1.15) translateY(-10px); }
        @keyframes startPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .start-subtitle { color: #ffcc00; font-size: 32px; margin-top: 40px; animation: fadeInOut 2.5s infinite; }
        @keyframes fadeInOut { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 900; flex-direction: column; }
        .loading-spinner { width: 100px; height: 100px; border: 10px solid #333; border-top: 10px solid #ffcc00; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .loading-text { color: #ffcc00; font-size: 28px; margin-top: 25px; font-weight: 700; }
        
        .audio-visualizer { position: fixed; bottom: 20px; right: 25px; display: flex; gap: 6px; z-index: 110; }
        .vis-bar { width: 10px; background: linear-gradient(180deg, #ffcc00 0%, #ff0000 100%); border-radius: 5px; animation: visualize 0.8s ease-in-out infinite; }
        .vis-bar:nth-child(1) { height: 25px; animation-delay: 0s; }
        .vis-bar:nth-child(2) { height: 45px; animation-delay: 0.1s; }
        .vis-bar:nth-child(3) { height: 65px; animation-delay: 0.2s; }
        .vis-bar:nth-child(4) { height: 55px; animation-delay: 0.3s; }
        .vis-bar:nth-child(5) { height: 40px; animation-delay: 0.4s; }
        .vis-bar:nth-child(6) { height: 30px; animation-delay: 0.5s; }
        @keyframes visualize { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1.2); } }
        
        @media (max-width: 768px) {
            .channel-logo { font-size: 36px; }
            .live-text { font-size: 20px; }
            .time-display { font-size: 28px; }
            .label { font-size: 3.5vw; }
            #headline { font-size: 4vw; }
            .start-button { font-size: 36px; padding: 35px 70px; }
            .anchor-overlay { width: 200px; height: 280px; }
        }
    </style>
</head>
<body>
    <div class="bg-animation"></div>
    <div class="bg-particles" id="particles"></div>
    
    <div id="overlay" onclick="startChannel()">
        <div class="start-button">▶ START BROADCAST</div>
        <div class="start-subtitle">प्रसारण शुरू करने के लिए क्लिक करें</div>
    </div>
    
    <div class="loading-overlay" id="loadingScreen">
        <div class="loading-spinner"></div>
        <div class="loading-text">समाचार लोड हो रहे हैं...</div>
    </div>
    
    <div class="header-bar">
        <div class="channel-logo">PTN NEWS</div>
        <div class="live-badge">
            <div class="live-dot"></div>
            <div class="live-text">LIVE</div>
        </div>
    </div>
    
    <div class="time-widget">
        <div class="time-display" id="timeDisplay">00:00:00</div>
        <div class="date-display" id="dateDisplay">Loading...</div>
    </div>
    
    <div class="news-counter">
        खबर: <span class="counter-number" id="newsCounter">0/0</span>
    </div>
    
    <div id="tv-screen">
        <div class="broadcast-container">
            <div class="corner-decoration corner-tl"></div>
            <div class="corner-decoration corner-tr"></div>
            <div class="corner-decoration corner-bl"></div>
            <div class="corner-decoration corner-br"></div>
            
            <video id="news-video" controls muted playsinline></video>
            <img id="news-img" alt="PTN News">
            
            <div class="anchor-overlay">
                <div class="anchor-avatar">📺</div>
                <div class="anchor-name">एंकर PTN</div>
                <div class="anchor-title">मुख्य समाचार वाचक</div>
                <div class="speaking-indicator">
                    <div class="speak-bar"></div>
                    <div class="speak-bar"></div>
                    <div class="speak-bar"></div>
                    <div class="speak-bar"></div>
                    <div class="speak-bar"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="ticker-wrap">
        <div class="ticker-header">
            <div class="label">⚡ BREAKING NEWS</div>
        </div>
        <div id="headline">कनेक्टिंग...</div>
    </div>
    
    <div class="audio-visualizer">
        <div class="vis-bar"></div>
        <div class="vis-bar"></div>
        <div class="vis-bar"></div>
        <div class="vis-bar"></div>
        <div class="vis-bar"></div>
        <div class="vis-bar"></div>
    </div>
    
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_2c2e3f9e1f.mp3" type="audio/mpeg">
    </audio>
    
    <script>
        const CSV_LINK = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS5LBOefZdg-qJDLrY3I2RS2GDuiwkfTUDAPikuoXhabZomXt4JPMcQ7obkE663GHOoG2f-J0DJ8QKz/pub?gid=0&single=true&output=csv';

        // Default placeholder image (base64 encoded 1x1 red pixel)
        const DEFAULT_IMAGE = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTI4MCIgaGVpZ2h0PSI3MjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjEyODAiIGhlaWdodD0iNzIwIiBmaWxsPSIjY2MwMDAwIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSI0OCIgZmlsbD0iI2ZmZmZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPlBUTiBORVdTIExJVkU8L3RleHQ+PC9zdmc+';

        let newsData = [];
        let index = 0;
        let isRunning = false;
        let bgMusicPlaying = false;

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 20 + 8 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = Math.random() * 15 + 15 + 's';
                container.appendChild(particle);
            }
        }

        function updateTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('hi-IN', { hour12: false });
            const date = now.toLocaleDateString('hi-IN', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            document.getElementById('timeDisplay').innerText = time;
            document.getElementById('dateDisplay').innerText = date;
        }

        setInterval(updateTime, 1000);
        updateTime();

        async function loadNews() {
            const loadingScreen = document.getElementById('loadingScreen');
            loadingScreen.style.display = 'flex';
            
            try {
                const res = await fetch(CSV_LINK + '&t=' + Date.now());
                const text = await res.text();
                const rows = text.split('\n').slice(1);
                
                newsData = rows.map(r => {
                    const cols = r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return { 
                        text: cols[0] ? cols[0].replace(/"/g, '').trim() : "",
                        image: cols[1] ? cols[1].replace(/"/g, '').trim() : "",
                        video: cols[2] ? cols[2].replace(/"/g, '').trim() : "",
                        voice: cols[3] ? cols[3].replace(/"/g, '').trim() : ""
                    };
                }).filter(n => n.text.length > 3);
                
                console.log(`✅ ${newsData.length} समाचार लोड हुए`);
                loadingScreen.style.display = 'none';
                return true;
            } catch (e) { 
                console.error("❌ Error:", e); 
                loadingScreen.style.display = 'none';
                return false; 
            }
        }

        function convertToHindiNumbers(text) {
            const digitMap = {
                '0': 'शून्य', '1': 'एक', '2': 'दो', '3': 'तीन', '4': 'चार',
                '5': 'पांच', '6': 'छह', '7': 'सात', '8': 'आठ', '9': 'नौ',
                '10': 'दस', '11': 'ग्यारह', '12': 'बारह', '13': 'तेरह', '14': 'चौदह',
                '15': 'पंद्रह', '16': 'सोलह', '17': 'सत्रह', '18': 'अठारह', '19': 'उन्नीस',
                '20': 'बीस', '30': 'तीस', '40': 'चालीस', '50': 'पचास',
                '60': 'साठ', '70': 'सत्तर', '80': 'अस्सी', '90': 'नब्बे',
                '100': 'सौ', '1000': 'हजार', 
                '2024': 'दो हजार चौबीस', '2025': 'दो हजार पच्चीस', '2026': 'दो हजार छब्बीस'
            };
            
            let result = text;
            result = result.replace(/\b20(\d{2})\b/g, match => digitMap[match] || match);
            result = result.replace(/\b(\d+)\b/g, match => digitMap[match] || match);
            return result;
        }

        function speak(txt) {
            return new Promise(resolve => {
                try {
                    window.speechSynthesis.cancel();
                    const hindiText = convertToHindiNumbers(txt);
                    const utterance = new SpeechSynthesisUtterance(hindiText);
                    utterance.lang = 'hi-IN'; 
                    utterance.rate = 0.82;
                    utterance.pitch = 1;
                    utterance.volume = 1;
                    const voices = window.speechSynthesis.getVoices();
                    const hiVoice = voices.find(v => v.lang.includes('hi')) || voices[0];
                    utterance.voice = hiVoice;
                    utterance.onend = resolve;
                    utterance.onerror = resolve;
                    setTimeout(() => { window.speechSynthesis.speak(utterance); }, 600);
                } catch(e) {
                    console.warn('TTS not available');
                    setTimeout(resolve, 3000);
                }
            });
        }

        function playVoice(url) {
            return new Promise((resolve) => {
                if (!url || !url.startsWith('http')) { 
                    resolve(); 
                    return; 
                }
                try {
                    const audio = new Audio();
                    audio.volume = 1;
                    audio.onended = resolve;
                    audio.onerror = () => { 
                        console.warn('Voice file could not be loaded'); 
                        resolve(); 
                    };
                    audio.src = url;
                    audio.play().catch(() => resolve());
                } catch(e) {
                    resolve();
                }
            });
        }

        function showMedia(item) {
            const video = document.getElementById('news-video');
            const img = document.getElementById('news-img');
            
            video.style.animation = 'none';
            img.style.animation = 'none';
            setTimeout(() => {
                video.style.animation = 'mediaAppear 1.2s ease-out';
                img.style.animation = 'mediaAppear 1.2s ease-out';
            }, 10);

            // Try video first
            if (item.video && item.video.startsWith('http')) {
                video.src = item.video;
                video.style.display = 'block';
                img.style.display = 'none';
                video.load();
                video.play().catch(() => {
                    // Video failed, show image instead
                    video.style.display = 'none';
                    img.style.display = 'block';
                    loadImage(item.image);
                });
            } 
            // Show image
            else {
                img.style.display = 'block';
                video.style.display = 'none';
                loadImage(item.image);
            }
        }

        function loadImage(url) {
            const img = document.getElementById('news-img');
            
            if (url && url.startsWith('http')) {
                // Test if image loads
                const testImg = new Image();
                testImg.onload = () => {
                    img.src = url;
                };
                testImg.onerror = () => {
                    console.warn('Image failed to load, using default');
                    img.src = DEFAULT_IMAGE;
                };
                testImg.src = url;
            } else {
                img.src = DEFAULT_IMAGE;
            }
        }

        function updateCounter() {
            document.getElementById('newsCounter').innerText = `${index + 1}/${newsData.length}`;
        }

        function playBackgroundMusic() {
            const bgMusic = document.getElementById('bgMusic');
            if (!bgMusicPlaying) {
                bgMusic.volume = 0.15;
                bgMusic.play().catch(() => {});
                bgMusicPlaying = true;
            }
        }

        async function runLoop() {
            if (!isRunning) return;
            if (newsData.length === 0) await loadNews();
            if (index >= newsData.length) { index = 0; await loadNews(); }

            const item = newsData[index];
            const headlineEl = document.getElementById('headline');
            headlineEl.style.animation = 'none';
            setTimeout(() => {
                headlineEl.innerText = item.text;
                headlineEl.style.animation = 'textSlideIn 1s ease-out';
            }, 10);
            
            showMedia(item);
            updateCounter();

            // Play voice or speak text
            if (item.voice && item.voice.startsWith('http')) {
                await playVoice(item.voice);
            } else if (item.text) {
                await speak(item.text);
            }
            
            await new Promise(r => setTimeout(r, 2500));
            index++;
            runLoop();
        }

        function startChannel() {
            document.getElementById('overlay').style.display = 'none';
            createParticles();
            playBackgroundMusic();
            window.speechSynthesis.getVoices();
            isRunning = true;
            runLoop();
        }
        
        window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        
        // Set default image on load
        document.getElementById('news-img').src = DEFAULT_IMAGE;
    </script>
</body>
</html>
